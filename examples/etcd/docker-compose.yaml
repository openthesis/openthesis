services:
  etcd1:
    container_name: etcd1
    hostname: etcd1
    image: gcr.io/etcd-development/etcd:v3.5.12
    environment:
      OPENTHESIS_OUTPUT_DIR: /tmp/openthesis-output
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=openthesis-etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 1s
      timeout: 5s
      retries: 30

  etcd2:
    container_name: etcd2
    hostname: etcd2
    image: gcr.io/etcd-development/etcd:v3.5.12
    environment:
      OPENTHESIS_OUTPUT_DIR: /tmp/openthesis-output
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=openthesis-etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 1s
      timeout: 5s
      retries: 30

  etcd3:
    container_name: etcd3
    hostname: etcd3
    image: gcr.io/etcd-development/etcd:v3.5.12
    environment:
      OPENTHESIS_OUTPUT_DIR: /tmp/openthesis-output
    command:
      - etcd
      - --name=etcd3
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=openthesis-etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 1s
      timeout: 5s
      retries: 30

  tests:
    container_name: tests
    hostname: tests
    image: openthesis-etcd-tests:latest
    environment:
      OPENTHESIS_OUTPUT_DIR: /tmp/openthesis-output
      OPENTHESIS_SDK_LOCAL_OUTPUT: /tmp/openthesis-output/sdk.jsonl
      ETCD_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
    depends_on:
      etcd1: { condition: service_healthy }
      etcd2: { condition: service_healthy }
      etcd3: { condition: service_healthy }
    volumes:
      - ./tests:/opt/openthesis/test
    command: sleep infinity
